#Render TaCZ attachment flashlights.
enabled = true
#Recognize flashlight, flash, weapon_light, light and emitter bones on LASER attachments.
#Laser-only bones are not automatically treated as flashlights.
automaticDetection = true
#Maximum camera distance for other players' weapon flashlights.
#Range: 1.0 ~ 256.0
remoteDistance = 64.0
#Attachment ID followed by = and its model emitter bone.
#Overrides automatic detection; bone names are case sensitive.
emitters = ["tacz:laser_peq15=flashlight", "tacz:laser_peq6=flash_illuminated", "tacz:laser_nightstick=laser_illuminated"]
#Attachment IDs that must never emit a flashlight beam.
disabledAttachments = ["tacz:laser_compact"]
#Tracks the one-time Tactical Breaching flashlight defaults migration.
#Once applied, later flashlight config and keybind choices are preserved.
#Set false to apply the disabled/unbound defaults again on the next client launch.
tacticalBreachingDefaultsApplied = false

