
#Weapon widget for TACZ guns. Only active when TACZ is installed.
[general]
	#Which weapon HUD is shown: TACZ_HUD (TACZ's own), TACZ_P_HUD (TaczPresence, falls back
	#to TACZ_HUD if missing) or MODERNHUD (this mod). Only the chosen one is drawn.
	#Allowed Values: TACZ_HUD, TACZ_P_HUD, MODERNHUD
	hudSource = "MODERNHUD"
	#Keep the weapon widget and ammo alerts visible when F1 (hide GUI) is on. Everything
	#else stays hidden.
	ignoreHideGui = false
	#Show the held gun's name under the ammo numbers.
	showName = true
	#Show the current fire mode (SEMI, AUTO or BURST).
	showFireMode = true
	#How overheat is shown for guns with TACZ's heat mechanic (such as the minigun). NONE
	#shows nothing, BAR adds a thin bar under the fire-mode row, FLASH makes the icon box
	#glow and pulse faster as it heats up. TACZ's own heat display is only available by
	#switching hudSource.
	#Allowed Values: NONE, BAR, FLASH
	heatDisplayMode = "NONE"
	#BAR mode: bar color while below the overheat-locked threshold, as a hex code.
	heatBarColor = "5FC8E8"
	#Color once the gun is overheated and locked. FLASH mode also uses it as the hot end of
	#the glow.
	heatBarLockedColor = "E85138"
	#FLASH mode: glow color when the gun is cold. It fades to heatBarLockedColor as heat
	#rises.
	heatFlashColor = "FFD866"
	#Show reserve ammo next to the magazine count. Hidden for guns that use inventory ammo
	#directly.
	showReserveAmmo = true

#Where the weapon widget is anchored on screen
[position]
	#Screen corner the widget is attached to. CUSTOM uses the offsets as absolute
	#coordinates.
	#Allowed Values: TOP_LEFT, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_RIGHT, CUSTOM
	anchor = "BOTTOM_RIGHT"
	#Horizontal distance from the anchor in pixels (absolute X when anchor is CUSTOM).
	#Range: -10000 ~ 10000
	offsetX = 8
	#Vertical distance from the anchor in pixels (absolute Y when anchor is CUSTOM).
	#Range: -10000 ~ 10000
	offsetY = 16
	#Overall scale multiplier applied to the whole weapon widget.
	#Range: 0.1 ~ 5.0
	scale = 0.85

#Icon scale and the fixed size of the widget. The size does not change from gun to gun.
[appearance]
	#Scale of TACZ's fixed 39x13 icon canvas. 1.5 draws it at about 58x19.
	#Range: 0.25 ~ 6.0
	iconScale = 1.25
	#Scale of the big mag-ammo number specifically (independent of the overall widget scale).
	#Range: 0.5 ~ 4.0
	ammoTextScale = 1.25
	#Width of the whole widget in pixels, before scaling. Used for screen-edge anchoring.
	#Range: 32 ~ 1000
	frameWidth = 129
	#Height of the whole widget in pixels, before scaling. Must fit the icon plus the
	#secondary weapon slot under it.
	#Range: 16 ~ 1000
	frameHeight = 40
	#Height of the info box (ammo, name, fire mode): how many pixels it rises above the top of the main
	#weapon box. Its bottom edge always lines up with the bottom of the secondary weapon box.
	#0 makes the tops flush, negative values make the box shorter than the weapon box.
	#The three rows stay tightly packed and centred; extra height only adds margin. Never smaller than the rows need.
	#Range: -10 ~ 40
	infoBoxRise = 5
	#Pad ammo numbers to three digits (030 instead of 30).
	zeroPadAmmo = true

#Secondary weapon slot: a small, dim icon of the last different gun you held, if it is
#still in your hotbar.
[secondary]
	#Show the secondary weapon thumbnail.
	showSecondary = false
	#Scale of the secondary weapon icon. Keep it below iconScale.
	#Range: 0.15 ~ 4.0
	secondaryIconScale = 0.85
	#Opacity of the secondary weapon icon, 0 to 1.
	#Range: 0.1 ~ 1.0
	secondaryAlpha = 0.8

#Boxes behind the icons and ammo readout: fills, borders and the weapon-switch
#animation.
[panel]
	#Draw a background box behind the icon boxes and the fire-mode row.
	enabled = false
	#Panel background color, as a hex code (e.g. "0A0D11" or "#0A0D11").
	panelColor = "D9DEE3"
	#Box opacity, 0 to 100. The secondary weapon box is also scaled by secondaryAlpha.
	#Range: 0 ~ 100
	panelOpacity = 10
	#Border style: NONE, CORNERS (short L-shaped brackets), FULL (thin outline), DOTS,
	#BOTTOM_DOTS or FRAME.
	#Allowed Values: NONE, CORNERS, FULL, DOTS, BOTTOM_DOTS, FRAME
	borderStyle = "CORNERS"
	#Border/corner-bracket color, as a hex code (e.g. "E8ECF0" or "#E8ECF0").
	borderColor = "E8ECF0"
	#Border opacity, 0 to 100.
	#Range: 0 ~ 100
	borderOpacity = 90
	#Length of each bracket arm in pixels. Capped to a fraction of each box's size.
	#Range: 1 ~ 20
	borderLength = 2
	#How far brackets and dots sit outside the box edge, in pixels. 0 puts them on the
	#edge.
	#Range: 0 ~ 20
	borderOutset = 1
	#Flash behind the main icon when you switch weapons, and a red glow around the ammo row
	#while the magazine is low.
	glowEnabled = false
	#The one glow color of the weapon widget, as a hex code. Used by the switch flash, the
	#corner glow of the selected weapon box and the ammo glow. The low-ammo glow uses
	#ammoLowColor.
	weaponGlowColor = "F2D98D"
	#Small bullet icon next to the reserve count, tinted like the reserve number.
	showAmmoTypeIcon = false
	#Size of that icon relative to the reserve number's height.
	#Range: 0.1 ~ 1.5
	ammoTypeIconScale = 0.7
	#Row of small squares above the main icon, one per attachment slot the gun has. Filled
	#gold when equipped, dim when empty.
	showAttachmentDots = false
	#Color of filled attachment dots, as a hex code. Empty slots draw nothing.
	attachmentDotColor = "FFC94A"
	#Size in pixels of the two corner squares on the secondary weapon box.
	#Range: 1 ~ 12
	secondaryDotSize = 2
	#Icon box slides up into place when you switch weapons.
	showSwitchSlide = false
	#How far below its final position the icon starts on a switch, in pixels, before
	#scaling.
	#Range: 0 ~ 100
	switchSlideDistance = 8
	#Brief gold border flash around the main icon box on a weapon switch.
	showSwitchBorderFlash = false
	#Switch border-flash color, as a hex code. Defaults to a warm gold.
	switchBorderFlashColor = "FFC94A"
	#Time in milliseconds for the flash to fade back to the normal border color.
	#Range: 50 ~ 5000
	switchBorderFlashMs = 450

#Text colors, as hex codes with or without a leading #.
[colors]
	#Mag ammo number color above the low-ammo threshold.
	ammoColor = "FFFFFF"
	#Mag ammo number color at/below the low-ammo threshold.
	ammoLowColor = "E85138"
	#Below this percentage of magazine size the number uses the low-ammo color and the LOW
	#AMMO alert appears.
	#Range: 0.0 ~ 100.0
	lowAmmoThresholdPercent = 20.0
	#Reserve number color, before reserveOpacity.
	reserveColor = "F2F6FA"
	#How much smaller the reserve number is than the magazine number. 0 makes them the same size,
	#as in the reference. With pixel-perfect text any value above 0 drops the reserve by one whole
	#screen pixel per font pixel, which is a big step at small sizes.
	#Range: 0.0 ~ 1.0
	reserveSizeDrop = 0.05
	#Reserve number opacity, 0 to 100.
	#Range: 0 ~ 100
	reserveOpacity = 70
	#Weapon name text color.
	nameColor = "E6EEF5"
	#Fire mode text color.
	fireModeColor = "9FD3F0"

#Fire mode announcement shown above the crosshair when you pull a gun: a flash color,
#then a held color, then it fades out.
[fireTypeFlash]
	#Show the "FIRE TYPE: ..." flash announcement on weapon switch.
	enabled = true
	#Color during the initial flash phase, hex code.
	flashColor = "FFD866"
	#Color while the text is held, as a hex code.
	holdColor = "FFFFFF"
	#How long the flash color lasts in milliseconds.
	#Range: 0 ~ 5000
	flashMs = 150
	#How long the held color stays fully visible before fading, in milliseconds.
	#Range: 0 ~ 20000
	holdMs = 900
	#How long (ms) the fade-out takes once the hold period ends.
	#Range: 0 ~ 20000
	fadeMs = 400
	#Text scale of the announcement.
	#Range: 0.25 ~ 4.0
	scale = 1.0
	#Horizontal offset in px from screen center (positive = further right).
	#Range: -2000 ~ 2000
	xOffset = 0
	#Vertical offset from screen center in pixels. Positive moves it down, negative moves
	#it up.
	#Range: -2000 ~ 2000
	yOffset = 70
	#true shows FIRE TYPE: FULL AUTO, false shows just FULL AUTO.
	showLabel = false

#Center-screen alerts for RELOAD, NO AMMO and LOW AMMO. Not shown for guns that use
#inventory ammo or while overheated.
[ammoAlerts]
	#Show the RELOAD / NO AMMO / LOW AMMO pulsing alert text.
	enabled = false
	#"RELOAD" alert color (mag empty, reserve available), hex code.
	reloadAlertColor = "FFD866"
	#"NO AMMO" alert color (mag AND reserve both empty), hex code.
	noAmmoAlertColor = "E85138"
	#"LOW AMMO" alert color (mag below the low-ammo threshold above), hex code.
	lowAmmoAlertColor = "FFD866"
	#Scale of the alert text.
	#Range: 0.25 ~ 4.0
	ammoAlertScale = 1.0
	#Vertical offset in px from screen center (positive = further down).
	#Range: -2000 ~ 2000
	ammoAlertYOffset = 55
	#The alert text pulses (breathes) while shown. Off = steady.
	ammoAlertPulse = false
	#Soft glow in the alert's color behind the text.
	ammoAlertGlow = false

	#Look of this element: opacity, fade times, panel and border.
	[ammoAlerts.style]
		#Opacity of the whole element, 0 to 100.
		#Range: 0 ~ 100
		opacity = 100
		#Fade-in time in milliseconds. 0 is instant.
		#Range: 0 ~ 5000
		fadeInMs = 160
		#Fade-out time in milliseconds. 0 is instant.
		#Range: 0 ~ 5000
		fadeOutMs = 260
		#Draw a flat background panel behind the element.
		panelEnabled = false
		#Panel color as a hex code, for example D9DEE3.
		panelColor = "D9DEE3"
		#Panel opacity, 0 to 100.
		#Range: 0 ~ 100
		panelOpacity = 16
		#Border style: NONE, CORNERS (short L-shaped brackets), FULL (thin outline),
		#DOTS (one dot per corner), BOTTOM_DOTS (bottom corners only) or FRAME (outline with corner dots).
		#Allowed Values: NONE, CORNERS, FULL, DOTS, BOTTOM_DOTS, FRAME
		borderStyle = "NONE"
		#Border color as a hex code, for example E8ECF0.
		borderColor = "E8ECF0"
		#Border opacity, 0 to 100.
		#Range: 0 ~ 100
		borderOpacity = 90
		#Bracket arm length for CORNERS, or dot size plus 1 for DOTS and FRAME, in pixels.
		#Range: 1 ~ 20
		borderLength = 3
		#How far brackets and dots sit outside the element's edge, in pixels.
		#Range: 0 ~ 20
		borderOutset = 1

#Slots next to the weapon box (needs lrtactical): your melee item on top and up to two
#throwables or consumables below with their counts. A used-up item shows a red X and 0.
[gear]
	#Show the gear slots (melee on top, throwable / consumable below).
	showGear = false
	#false counts hotbar items only. true counts the whole inventory (items are still found
	#in the hotbar).
	countWholeInventory = false
	#Soft round glow behind the gear icons.
	glow = false
	#Corner dots on the throwable slots. true puts the top dots on the outer corners, false
	#on the inner corners facing each other.
	topDotsOuter = false
	#Only reserve room for slots that are in use. With no gear the weapon box moves into
	#the corner, with only throwables the column shrinks to fit them.
	autoLayout = true
	#Glow in the inner corners of the selected weapon box, drawn behind the gun icon.
	selectedGlow = false
	#Strength of the corner glow, 0-100 (also scaled by the global glow intensity).
	#Range: 0 ~ 100
	selectedGlowStrength = 80
	#How far each corner glow reaches into the box, in pixels before scaling.
	#Range: 4 ~ 64
	selectedGlowReach = 30
	#Glow strength in the top-left corner, 0 to 100. 0 turns that corner off.
	#Range: 0 ~ 100
	selectedGlowTopLeft = 100
	#Glow strength in the top-right inner corner, 0 to 100.
	#Range: 0 ~ 100
	selectedGlowTopRight = 0
	#Glow strength in the bottom-right corner, 0 to 100.
	#Range: 0 ~ 100
	selectedGlowBottomRight = 100
	#Glow strength in the bottom-left inner corner, 0 to 100.
	#Range: 0 ~ 100
	selectedGlowBottomLeft = 0
	#Slowly breathe the glow in and out instead of keeping it steady.
	selectedGlowPulse = false
	#Length of one pulse in milliseconds. Only used when selectedGlowPulse is on.
	#Range: 300 ~ 6000
	selectedGlowPulseMs = 1800
	#How far the pulse dips, 0 to 100. 100 fades the glow out completely at the low point.
	#Range: 0 ~ 100
	selectedGlowPulseDepth = 50
	#Extra brightness, 0 to 100, that flashes in when you switch weapons and fades out.
	#Range: 0 ~ 100
	selectedGlowSwitchBoost = 40

	#Look of this element: opacity, fade times, panel and border.
	[gear.style]
		#Opacity of the whole element, 0 to 100.
		#Range: 0 ~ 100
		opacity = 100
		#Fade-in time in milliseconds. 0 is instant.
		#Range: 0 ~ 5000
		fadeInMs = 200
		#Fade-out time in milliseconds. 0 is instant.
		#Range: 0 ~ 5000
		fadeOutMs = 200
		#Draw a flat background panel behind the element.
		panelEnabled = true
		#Panel color as a hex code, for example D9DEE3.
		panelColor = "D9DEE3"
		#Panel opacity, 0 to 100.
		#Range: 0 ~ 100
		panelOpacity = 10
		#Border style: NONE, CORNERS (short L-shaped brackets), FULL (thin outline),
		#DOTS (one dot per corner), BOTTOM_DOTS (bottom corners only) or FRAME (outline with corner dots).
		#Allowed Values: NONE, CORNERS, FULL, DOTS, BOTTOM_DOTS, FRAME
		borderStyle = "DOTS"
		#Border color as a hex code, for example E8ECF0.
		borderColor = "E8ECF0"
		#Border opacity, 0 to 100.
		#Range: 0 ~ 100
		borderOpacity = 90
		#Bracket arm length for CORNERS, or dot size plus 1 for DOTS and FRAME, in pixels.
		#Range: 1 ~ 20
		borderLength = 2
		#How far brackets and dots sit outside the element's edge, in pixels.
		#Range: 0 ~ 20
		borderOutset = 0

#The box around the ammo numbers, gun name and fire mode: spacing between its rows,
#and its own panel and border (separate from the weapon icon boxes). Its height is
#appearance.infoBoxRise.
[infoBox]
	#Gap in pixels between the ammo numbers and the gun name (0 = touching).
	#Range: 0 ~ 16
	nameGap = 1
	#Gap in pixels between the gun name and the fire mode row.
	#Range: 0 ~ 16
	rowGap = 2
	#Gap in pixels between the info box and the weapon boxes. The box gets narrower by the same amount,
	#so raise appearance.frameWidth by that much to keep its width. Negative values pull it closer.
	#Range: -6 ~ 40
	gapToWeapon = 6
	#Moves everything inside the info box (ammo, name, fire mode) up by this many pixels. The box stays put.
	#Capped so the rows never leave the box. Negative values move them down.
	#Range: -10 ~ 30
	contentRaise = 4
	#Size of the ammo digits, the reserve icon and the fire mode control inside the info box, in percent.
	#With pixel-perfect text the digits change in whole-pixel steps, so small changes may not show.
	#Range: 50 ~ 130
	contentScale = 92

	#Look of this element: opacity, fade times, panel and border.
	[infoBox.style]
		#Opacity of the whole element, 0 to 100.
		#Range: 0 ~ 100
		opacity = 100
		#Fade-in time in milliseconds. 0 is instant.
		#Range: 0 ~ 5000
		fadeInMs = 0
		#Fade-out time in milliseconds. 0 is instant.
		#Range: 0 ~ 5000
		fadeOutMs = 0
		#Draw a flat background panel behind the element.
		panelEnabled = false
		#Panel color as a hex code, for example D9DEE3.
		panelColor = "D9DEE3"
		#Panel opacity, 0 to 100.
		#Range: 0 ~ 100
		panelOpacity = 10
		#Border style: NONE, CORNERS (short L-shaped brackets), FULL (thin outline),
		#DOTS (one dot per corner), BOTTOM_DOTS (bottom corners only) or FRAME (outline with corner dots).
		#Allowed Values: NONE, CORNERS, FULL, DOTS, BOTTOM_DOTS, FRAME
		borderStyle = "CORNERS"
		#Border color as a hex code, for example E8ECF0.
		borderColor = "E8ECF0"
		#Border opacity, 0 to 100.
		#Range: 0 ~ 100
		borderOpacity = 0
		#Bracket arm length for CORNERS, or dot size plus 1 for DOTS and FRAME, in pixels.
		#Range: 1 ~ 20
		borderLength = 1
		#How far brackets and dots sit outside the element's edge, in pixels.
		#Range: 0 ~ 20
		borderOutset = 1

#Soft glow behind the ammo readout (mag | reserve)
[ammoGlow]
	#Glow for the ammo box: a light fill inside the border plus a halo on the magazine
	#digits.
	enabled = false
	#Strength of the halo around the magazine digits, 0 to 100.
	#Range: 0 ~ 100
	opacity = 35
	#Reach of the digit halo in font pixels. 0 turns the halo off.
	#Range: 0 ~ 4
	haloRadius = 2
	#Strength of the soft haze behind the ammo digits, 0 to 100. 0 turns it off.
	#Range: 0 ~ 100
	strength = 45
	#How far the fill fades out past the border, in pixels before scaling.
	#Range: 0 ~ 30
	spread = 5
	#Color the digit halo with the low-ammo color while the magazine is low.
	followLowAmmo = false
	#Small box in the glow color behind the reserve count. It replaces the divider line.
	reservePanel = false
	#Opacity of the reserve box, 0 to 100.
	#Range: 0 ~ 100
	reservePanelOpacity = 25
	#Height of the reserve box as a percentage of the digit height. 100 matches the digits, 90 is slightly shorter.
	#Range: 40 ~ 160
	reservePanelHeight = 90
	#While the magazine is low, the red glow around the ammo row pulses (true) or stays
	#steady (false).
	lowAmmoPulse = false
	#Slowly breathe the haze and the digit halo in and out.
	pulse = false

