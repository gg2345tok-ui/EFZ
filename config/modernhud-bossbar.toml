
#Compact boss bars in a screen corner, replacing vanilla's wide bars at the top of the
#screen.
[bossBar]
	#Replace vanilla's boss bars with the compact corner version. Off = vanilla look.
	enabled = false
	#Screen corner the boss bars are tucked into.
	#Allowed Values: TOP_LEFT, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_RIGHT, CUSTOM
	position = "TOP_LEFT"
	#Horizontal offset in px from that corner's edge.
	#Range: -2000 ~ 4000
	offsetX = 8
	#Vertical offset in px from that corner's edge.
	#Range: -2000 ~ 4000
	offsetY = 90
	#Scale of the whole block. Keep it at a whole number if the pixel font looks uneven.
	#Range: 0.5 ~ 4.0
	scale = 1.0
	#Bar length in pixels, before scaling.
	#Range: 30 ~ 300
	barWidth = 70
	#Thickness of the filled part in pixels, before scaling. The empty track stays a thin
	#line.
	#Range: 1 ~ 12
	barHeight = 3
	#Gap between boss bars in pixels, before scaling.
	#Range: 0 ~ 40
	barSpacing = 1
	#Most boss bars shown at once; extra ones are simply not drawn.
	#Range: 1 ~ 10
	maxBars = 2
	#Show the number next to the bar (see numberMode).
	showNumber = true
	#PERCENT shows progress from 0 to 100. HEALTH shows exact health when the boss entity
	#is loaded and matches the bar name, otherwise the percent.
	#Allowed Values: PERCENT, HEALTH
	numberMode = "HEALTH"
	#Append a % to percent numbers.
	percentSign = false
	#Number text scale. Whole numbers (1, 2) keep the font sharp.
	#Range: 0.5 ~ 3.0
	numberScale = 1.0
	#Boss name: HIDDEN, ABOVE (small, right-aligned over the bar) or BELOW (left-aligned
	#under the bar).
	#Allowed Values: HIDDEN, ABOVE, BELOW
	nameMode = "ABOVE"
	#Size of the name label. 1.0 = the font's native size (sharpest).
	#Range: 0.5 ~ 3.0
	nameScale = 1.0
	#Tint the bar with the boss event's color. Off keeps it white.
	useBossColor = true
	#Draw a thin line along the whole bar so the empty part stays visible.
	showTrack = true
	#Soft glow outline around the filled part of the bar.
	barGlow = true
	#Make the leading edge of the fill glow.
	headGlow = true
	#What sits behind each bar: NONE, SHADOW (soft dark fade) or BOX (a panel).
	#Allowed Values: NONE, SHADOW, BOX
	backdrop = "SHADOW"
	#Strength of the per-bar shadow / box, 0-100.
	#Range: 0 ~ 100
	backdropOpacity = 55
	#Where numbers go: SIDE (left of each bar), ABOVE_BELOW (first bar above, last bar
	#below, made for two bars), ABOVE or BELOW. The boss name shares the row when a number
	#is above or below.
	#Allowed Values: SIDE, ABOVE_BELOW, ABOVE, BELOW
	numberLayout = "ABOVE_BELOW"
	#Strength of the bar glow and head glow, 0 to 100. Needs barGlow or headGlow on.
	#Range: 0 ~ 100
	glowIntensity = 60
	#Bars slide and fade in and out, the fill eases to its value and the stack moves
	#smoothly when a bar appears or goes.
	animations = true
	#Length of those animations in milliseconds.
	#Range: 100 ~ 2000
	animationMs = 380
	#Bar and number pulse red when the bar drops to 20% or less.
	lowWarning = true
	#When the boss loses health, the lost part stays as a lighter trail and then drains
	#away.
	damageTrail = true

	#Look of this element: opacity, fade times, panel and border.
	[bossBar.style]
		#Opacity of the whole element, 0 to 100.
		#Range: 0 ~ 100
		opacity = 100
		#Fade-in time in milliseconds. 0 is instant.
		#Range: 0 ~ 5000
		fadeInMs = 380
		#Fade-out time in milliseconds. 0 is instant.
		#Range: 0 ~ 5000
		fadeOutMs = 380
		#Draw a flat background panel behind the element.
		panelEnabled = true
		#Panel color as a hex code, for example D9DEE3.
		panelColor = "D9DEE3"
		#Panel opacity, 0 to 100.
		#Range: 0 ~ 100
		panelOpacity = 16
		#Border style: NONE, CORNERS (short L-shaped brackets), FULL (thin outline),
		#DOTS (one dot per corner), BOTTOM_DOTS (bottom corners only) or FRAME (outline with corner dots).
		#Allowed Values: NONE, CORNERS, FULL, DOTS, BOTTOM_DOTS, FRAME
		borderStyle = "NONE"
		#Border color as a hex code, for example E8ECF0.
		borderColor = "E8ECF0"
		#Border opacity, 0 to 100.
		#Range: 0 ~ 100
		borderOpacity = 90
		#Bracket arm length for CORNERS, or dot size plus 1 for DOTS and FRAME, in pixels.
		#Range: 1 ~ 20
		borderLength = 3
		#How far brackets and dots sit outside the element's edge, in pixels.
		#Range: 0 ~ 20
		borderOutset = 1

