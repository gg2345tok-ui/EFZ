
[sound_and_visual_effects]
	#Enhance the gunfire so the Headset lowering noises work as expectedly
	audio_effect = true
	#React to incoming bullets by visual and sounds
	bullet_suppression = true

[tooltips]
	#Shows trajectory while holding the gun and inspect inventory ammo
	trajectory_tooltip = true
	#Shows ammo type overlay
	ammo_type_Overlay = true
	#Shows ammo type tooltip
	ammo_type_toolTip = true

