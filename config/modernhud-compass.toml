
#Master switch
[general]
	#Show the compass. Also toggleable in-game with the keybind (unbound by default).
	enabled = true

#The heading tape
[tape]
	#Length of the tape in GUI units. It always covers 90 degrees. 420 matches the
	#reference proportions.
	#Range: 120.0 ~ 1200.0
	length = 400.0
	#Overall scale (text, ticks and readout together).
	#Range: 0.5 ~ 3.0
	scale = 0.6
	#Distance from the top of the screen, in GUI units.
	#Range: -200.0 ~ 600.0
	offsetY = 8.0
	#How far (GUI units) the tape fades out at both ends.
	#Range: 1 ~ 600
	fadeLength = 80
	#Color of ticks, numbers and the readout.
	color = "#E8ECF0"
	#Opacity of the small ticks, numbers and place name. Cardinal letters and the readout
	#stay fully opaque.
	#Range: 0.0 ~ 1.0
	dimOpacity = 0.51
	#Drop shadow under the compass text (the reference has none).
	textShadow = true

#The bracketed readout under the tape
[readout]
	#Show the readout box (direction + degrees).
	show = true
	#Border of the readout box. CORNERS is a faint outline with bright corner brackets, any
	#other value is that plain border style.
	#Allowed Values: NONE, CORNERS, FULL, DOTS, BOTTOM_DOTS, FRAME
	border = "CORNERS"
	#The place name next to the readout: BIOME, COORDINATES or OFF.
	#Allowed Values: OFF, COORDINATES, BIOME
	location = "OFF"
	#Small dim coordinate / altitude text at the two ends of the tape.
	sideInfo = false

#Markers drawn on the tape
[markers]
	#Draw gunfire and ping markers on the tape. Each type is set up in its own section.
	show = false

#Ping markers on the tape (Modern Ping, or the original Ping Wheel). Modern Ping sends
#each ping to your whole team, so a ping on an enemy shows on every teammate's compass.
[pings]
	#Show pings on the compass.
	enabled = false
	#Pings that land on a player who is not on your team.
	enemyPlayers = true
	#Pings that land on a hostile mob (anything the game counts as an Enemy, such as
	#zombies or creepers).
	hostileMobs = true
	#Pings that land on a vehicle that is not yours. A vehicle is yours if it is on your
	#team or a teammate is riding it.
	vehicles = true
	#Also show pinged vehicles with no team and no rider.
	emptyVehicles = true
	#Class name prefixes, separated by commas, that identify a vehicle. The default covers
	#SuperbWarfare. Add another vehicle mod's package to include it.
	vehicleClassPrefixes = "com.atsuishio.superbwarfare.entity.vehicle"
	#Mod ids, separated by commas, whose entities (except projectiles and items) count as
	#vehicles, matched on the entity type id such as superbwarfare:bmp_2.
	vehicleNamespaces = "superbwarfare"
	#Write one line per new ping to logs/latest.log (entity class, entity type and why it
	#was shown or hidden). Lines start with ModernHud ping:.
	debugLog = false
	#Plain location pings (the ping did not land on any entity).
	locations = false
	#Pings on any other entity (animals, items, villagers...).
	otherEntities = false
	#Hide pings farther away than this many blocks. 0 means no limit.
	#Range: 0 ~ 4096
	maxDistance = 0
	#Size of the ping markers on the tape.
	#Range: 0.5 ~ 3.0
	markerScale = 1.0
	#Shrink far markers so near threats stand out.
	distanceScaling = true
	#Distance in blocks at which a marker has shrunk to its smallest size.
	#Range: 8 ~ 1024
	farDistance = 80
	#Marker size at that distance, as a percentage of the full size.
	#Range: 20 ~ 100
	farScalePercent = 60
	#Show an arrow at the end of the tape for pings outside the 90 degree view.
	edgeHints = true
	#Enemy player marker (a filled diamond).
	enemyColor = "#FF3B30"
	#Hostile mob marker (a filled square).
	hostileColor = "#FF9F0A"
	#Vehicle marker (a filled triangle).
	vehicleColor = "#FFD60A"
	#Color of location pings (hollow diamond) when the pinger's team color is not used.
	locationColor = "#FFFFFF"
	#Color location pings with the pinger's team color when they have one.
	locationTeamColor = true
	#Marker for other entities (a hollow square).
	otherColor = "#B8C4CC"

#TACZ gunfire compatibility
[gunfire]
	#Show enemy TACZ shooters heard by this client. Detection uses TACZ's own shot packets,
	#so attachments, silencers and sound distance are respected.
	enabled = true
	#Marker color.
	color = "#FF3B30"
	#Marker size at close range, as a percentage of the icon scale.
	#Range: 1.0 ~ 1000.0
	maxScalePercent = 100.0
	#Marker size at long range as a percentage of the icon scale. Raise it if far markers
	#are too small.
	#Range: 1.0 ~ 1000.0
	minScalePercent = 50.0
	#Distance in blocks that still uses the maximum marker scale.
	#Range: 0.0 ~ 10000.0
	maxScaleDistance = 10.0
	#Distance in blocks that reaches the minimum marker scale (linear in between).
	#Range: 0.01 ~ 10000.0
	minScaleDistance = 50.0
	#Icon pop duration after every shot, in seconds.
	#Range: 0.01 ~ 5.0
	popDuration = 0.15
	#Fully visible time after the most recent shot, in seconds.
	#Range: 0.0 ~ 60.0
	visibleDuration = 1.0
	#Fade-out duration after the most recent shot, in seconds.
	#Range: 0.01 ~ 10.0
	fadeDuration = 1.0

