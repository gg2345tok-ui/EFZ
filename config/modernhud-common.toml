
#Server-side detection of Absorption being hit or depleted. Only the attacker and the
#victim are notified.
[shieldFeedback]
	#Notify the attacker and the victim (sound only) when a hit lands on Absorption without
	#depleting it.
	enableHitFeedback = true
	#Notify the attacker (sound and icon) and the victim (sound only) when Absorption is
	#fully depleted.
	enableBreakFeedback = true
	#In vanilla, absorption hearts stay after the Absorption effect ends. With this on they
	#are cleared when the effect ends, so the HUD bar clears with it. Turn it off for
	#vanilla behavior.
	clearAbsorptionOnEffectEnd = true

#Hit, kill and headshot-kill cues for the attacker. The server decides when they play;
#each player picks style, volume and pitch in their own Sounds settings. Shield cues
#use the shieldFeedback options above.
[combatSounds]
	#Master switch for the hit / kill / headshot-kill cues.
	enabled = true
	#Play a cue to the attacker on a non-fatal hit.
	hitSound = true
	#Play a cue to the attacker on a kill.
	killSound = true
	#Play a cue on a headshot kill. Only TACZ reports headshots. It replaces the kill cue.
	headshotKillSound = true
	#While the victim still has Absorption, play the shield cue (shield hit or break)
	#instead of the hit cue. Once the shield is gone the hit cue plays. A killing blow
	#plays the kill cue and no shield cue.
	shieldPriority = true
	#true: only TACZ damage triggers hit and kill cues. false: any damage a player deals
	#does (melee, bows, SuperbWarfare, other mods). Headshots always need TACZ.
	restrictToTacz = false
	#Minimum time between hit cues for one player in milliseconds. Prevents sound spam from
	#fast guns. 0 means none.
	#Range: 0 ~ 2000
	hitCooldownMs = 20
	#Minimum time (ms) between kill cues per player (softens multi-kills). 0 = none.
	#Range: 0 ~ 2000
	killCooldownMs = 0

