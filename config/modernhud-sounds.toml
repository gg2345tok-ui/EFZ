
#Sound style used by the cues: 1 = classic, 2 = style 2, 3 = style 3. A cue's own style
#overrides this unless it is 0.
[style]
	#Sound style for all cues: 1 = classic, 2 = style 2, 3 = style 3.
	#Range: 1 ~ 3
	style = 1
	#Style for the hit cue only. 0 uses the style above.
	#Range: 0 ~ 3
	hitStyle = 0
	#Style for the kill cue only. 0 uses the style above.
	#Range: 0 ~ 3
	killStyle = 0
	#Style for the headshot-kill cue only. 0 uses the style above.
	#Range: 0 ~ 3
	headshotKillStyle = 0
	#Style for the shield-break cue only. Styles 1 and 2 share one sound, 3 has its own. 0
	#uses the style above.
	#Range: 0 ~ 3
	shieldBreakStyle = 0

#Ordinary hit (no shield involved)
[hit]
	#Hear the hit cue.
	enabled = true
	#Volume, 0.0-2.0 (Minecraft clamps the final loudness at full).
	#Range: 0.0 ~ 2.0
	volume = 1.0
	#Pitch, 0.5-2.0.
	#Range: 0.5 ~ 2.0
	pitch = 1.0

#Kill
[kill]
	#Hear the kill cue.
	enabled = true
	#Volume, 0.0-2.0.
	#Range: 0.0 ~ 2.0
	volume = 1.0
	#Pitch, 0.5-2.0.
	#Range: 0.5 ~ 2.0
	pitch = 1.0

#Headshot kill
[headshotKill]
	#Hear the headshot-kill cue.
	enabled = true
	#Volume, 0.0-2.0.
	#Range: 0.0 ~ 2.0
	volume = 1.0
	#Pitch, 0.5-2.0.
	#Range: 0.5 ~ 2.0
	pitch = 1.0

#A hit that lands on an active shield. Plays instead of the ordinary hit cue.
[shieldHit]
	#Hear the shield-hit cue.
	enabled = true
	#Volume, 0.0-2.0.
	#Range: 0.0 ~ 2.0
	volume = 1.0
	#Pitch, 0.5-2.0.
	#Range: 0.5 ~ 2.0
	pitch = 1.0

#Shield fully broken
[shieldBreak]
	#Hear the shield-break cue.
	enabled = true
	#Volume, 0.0-2.0.
	#Range: 0.0 ~ 2.0
	volume = 2.0
	#Pitch, 0.5-2.0.
	#Range: 0.5 ~ 2.0
	pitch = 1.0

#Silence the hit and kill sounds of other mods so only these cues are heard.
[override]
	#Cancel sounds from TACZ and SuperbWarfare that match the patterns below, so their hit
	#and kill cues do not play over yours.
	enabled = true
	#Sound ids to silence, separated by commas. * is a wildcard, for example tacz:*kill*.
	#If a sound still plays, turn on debugLog, trigger it and copy its id from
	#logs/latest.log (lines starting with ModernHud sound:).
	patterns = "tacz:*kill*,tacz:*headshot*,tacz:*hit_mark*,tacz:*hitmarker*,superbwarfare:*indication*,superbwarfare:*headshot*,superbwarfare:*kill*,superbwarfare:*hitmarker*,superbwarfare:hit"
	#Write the id of every sound played by TACZ or SuperbWarfare to logs/latest.log, to
	#find out what to silence.
	debugLog = false

