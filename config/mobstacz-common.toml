
["Mob Shooting"]
	#Damage multiplier for bullets shot by mobs. Range: 0.0 ~ 1.0. Default: 0.5
	#Range: 0.0 ~ 1.0
	mobBulletDamageMultiplier = 0.5
	#If true, mobs will gain the glowing effect after shooting.
	mobGlowsAfterShooting = false
	#Default extra delay after a mob shoots. Individual overrides and entity type tags take priority.
	additional_shoot_cooldown = true
	#Default ammo consumption for mobs when shooting and reloading. Individual overrides and entity type tags take priority.
	consume_ammo = true

